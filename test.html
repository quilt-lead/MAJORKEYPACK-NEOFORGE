<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Perlin Atmospheric Flow</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

<script>

let particles = [];


// ========================================
// DENSITY
// ========================================

let maxParticles = 2400;
let spawnRate = 14;


// ========================================
// FLOW FIELD
// ========================================

let noiseScale = 0.0035;
let secondaryScale = 0.001;


// ========================================
// FLOW
// ========================================

let flowStrength = 1.8;
let curlStrength = 2.2;


// ========================================
// INDIVIDUAL TRAIL LENGTH
// ========================================

let minTrailLength = 180;
let maxTrailLength = 700;


// ========================================
// GLOBAL CYCLE
// ========================================

let mode = "growing";

let cycleTimer = 0;

let buildTime = 600;
let holdTime = 300;
let deadTime = 100;


// ========================================
// CREATE PARTICLE
// ========================================

function createParticle() {

  return {

    x: random(width),
    y: random(height),

    trail: [],

    maxLength: random(
      minTrailLength,
      maxTrailLength
    ),

    ending: false
  };
}


// ========================================
// SETUP
// ========================================

function setup() {

  createCanvas(
    windowWidth,
    windowHeight
  );

  background(0);

  strokeWeight(0.22);

  noFill();

  noiseDetail(3, 0.5);
}


// ========================================
// DRAW
// ========================================

function draw() {

  cycleTimer++;


  // ========================================
  // CLEAR FRAME
  // ========================================

  // IMPORTANT:
  // We redraw everything from the trail arrays.
  // This allows trails to actually disappear.

  background(0);


  // ========================================
  // SPAWN
  // ========================================

  if (mode === "growing") {

    for (
      let i = 0;
      i < spawnRate;
      i++
    ) {

      if (
        particles.length <
        maxParticles
      ) {

        particles.push(
          createParticle()
        );
      }
    }
  }


  // ========================================
  // UPDATE PARTICLES
  // ========================================

  for (
    let i = particles.length - 1;
    i >= 0;
    i--
  ) {

    let p = particles[i];


    // ======================================
    // TRAIL IS ENDING
    // ======================================

    if (p.ending) {

      // Remove several points from the
      // beginning of the trail.
      //
      // This makes the visible line retreat
      // toward its final endpoint.

      let removalSpeed = 2;

      for (
        let j = 0;
        j < removalSpeed;
        j++
      ) {

        if (p.trail.length > 0) {

          p.trail.shift();
        }
      }


      // Completely gone

      if (
        p.trail.length === 0
      ) {

        particles.splice(i, 1);
      }

      continue;
    }


    // ======================================
    // CURL FIELD
    // ======================================

    let x =
      p.x * noiseScale;

    let y =
      p.y * noiseScale;

    let eps = 0.005;


    let nUp =
      noise(
        x,
        y + eps
      );

    let nDown =
      noise(
        x,
        y - eps
      );

    let nRight =
      noise(
        x + eps,
        y
      );

    let nLeft =
      noise(
        x - eps,
        y
      );


    let dx =
      (nUp - nDown) /
      (2 * eps);

    let dy =
      (nRight - nLeft) /
      (2 * eps);


    let vx = dx;

    let vy = -dy;


    // ======================================
    // NORMALIZE
    // ======================================

    let mag =
      sqrt(
        vx * vx +
        vy * vy
      );


    if (mag > 0) {

      vx /= mag;
      vy /= mag;
    }


    // ======================================
    // BROAD CURVATURE
    // ======================================

    let broad =
      noise(
        p.x * secondaryScale,
        p.y * secondaryScale
      );


    let broadAngle =
      broad *
      TWO_PI *
      2;


    vx +=
      cos(broadAngle) *
      0.35;

    vy +=
      sin(broadAngle) *
      0.35;


    // ======================================
    // MOVE
    // ======================================

    vx *=
      flowStrength *
      curlStrength;

    vy *=
      flowStrength *
      curlStrength;


    p.x += vx;
    p.y += vy;


    // ======================================
    // ADD POSITION TO TRAIL
    // ======================================

    p.trail.push({

      x: p.x,
      y: p.y
    });


    // ======================================
    // REACH END
    // ======================================

    if (
      p.trail.length >=
      p.maxLength
    ) {

      p.ending = true;
    }


    // ======================================
    // OFF SCREEN
    // ======================================

    if (
      p.x < -100 ||
      p.x > width + 100 ||
      p.y < -100 ||
      p.y > height + 100
    ) {

      p.ending = true;
    }
  }


  // ========================================
  // DRAW ALL CURRENT TRAILS
  // ========================================

  for (
    let i = 0;
    i < particles.length;
    i++
  ) {

    let p = particles[i];


    if (
      p.trail.length < 2
    ) {

      continue;
    }


    stroke(
      255,
      225
    );

    noFill();

    beginShape();


    for (
      let j = 0;
      j < p.trail.length;
      j++
    ) {

      let pt =
        p.trail[j];

      vertex(
        pt.x,
        pt.y
      );
    }


    endShape();
  }


  // ========================================
  // BUILD → HOLD
  // ========================================

  if (
    mode === "growing" &&
    cycleTimer >= buildTime
  ) {

    mode = "holding";

    cycleTimer = 0;
  }


  // ========================================
  // HOLD
  // ========================================

  if (
    mode === "holding" &&
    cycleTimer >= holdTime
  ) {

    mode = "ending";

    cycleTimer = 0;
  }


  // ========================================
  // ENDING
  // ========================================

  if (
    mode === "ending"
  ) {

    // No new particles are created.

    // Every remaining trail is allowed
    // to reach its own endpoint and then
    // disappear.

    if (
      particles.length === 0
    ) {

      mode = "dead";

      cycleTimer = 0;
    }
  }


  // ========================================
  // BLACK PAUSE
  // ========================================

  if (
    mode === "dead" &&
    cycleTimer >= deadTime
  ) {

    particles = [];

    mode = "growing";

    cycleTimer = 0;
  }
}


// ========================================
// RESIZE
// ========================================

function windowResized() {

  resizeCanvas(
    windowWidth,
    windowHeight
  );

  background(0);

  particles = [];

  mode = "growing";

  cycleTimer = 0;
}

</script>

</body>
</html>
