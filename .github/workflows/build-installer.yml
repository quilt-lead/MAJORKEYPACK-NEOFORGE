name: Installer

on:
  workflow_dispatch:

  push:
    paths:
      - "modpack-manifest.json"
      - "scripts/**"
      - "installer/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git fetch --tags --force

          $tags = @(
            git tag --list "v*" |
              Where-Object { $_ -match "^v\d+$" } |
              ForEach-Object {
                [int]$_.Substring(1)
              }
          )

          if ($tags.Count -eq 0) {
            $next = 1
          }
          else {
            $next = ($tags | Measure-Object -Maximum).Maximum + 1
          }

          $version = "v$next"

          Write-Host "Next release: $version"

          "version=$version" >> $env:GITHUB_OUTPUT
          "number=$next" >> $env:GITHUB_OUTPUT

      - name: Build standalone EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force "build" | Out-Null
          New-Item -ItemType Directory -Force "launcher-build" | Out-Null

          # Copy the PowerShell installer that the launcher will execute.
          Copy-Item `
            "installer\Install-MajorKeyPack.ps1" `
            "launcher-build\Install-MajorKeyPack.ps1" `
            -Force

          # Create the temporary .NET project.
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>

              <AssemblyName>MajorKeyPack-Installer</AssemblyName>
              <RootNamespace>MajorKeyPackInstaller</RootNamespace>

              <Version>1.0.${{ steps.version.outputs.number }}</Version>
              <AssemblyVersion>1.0.${{ steps.version.outputs.number }}</AssemblyVersion>

              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
            </PropertyGroup>

            <ItemGroup>
              <EmbeddedResource Include="Install-MajorKeyPack.ps1">
                <LogicalName>MajorKeyPackInstaller.Install-MajorKeyPack.ps1</LogicalName>
              </EmbeddedResource>
            </ItemGroup>
          </Project>
          "@ | Set-Content `
            "launcher-build\MajorKeyPack-Installer.csproj" `
            -Encoding UTF8

          # Copy the actual launcher source.
          Copy-Item `
            "installer\MajorKeyPackLauncher.cs" `
            "launcher-build\Program.cs" `
            -Force

          # Publish self-contained Windows x64 executable.
          dotnet publish `
            "launcher-build\MajorKeyPack-Installer.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o "build\launcher"

          $exe = "build\launcher\MajorKeyPack-Installer.exe"

          if (!(Test-Path $exe)) {
            throw "EXE build failed: $exe was not created."
          }

          Copy-Item `
            $exe `
            "build\MajorKeyPack-Installer.exe" `
            -Force

          Compress-Archive `
            -Path "build\MajorKeyPack-Installer.exe" `
            -DestinationPath "MajorKeyPack-Installer.zip" `
            -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.version }}"
          name: "Major Key Pack ${{ steps.version.outputs.version }}"
          make_latest: true
          generate_release_notes: true
          files: |
            MajorKeyPack-Installer.zip
            build/MajorKeyPack-Installer.exe
            modpack-manifest.json