name: Build Major Key Pack Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "modpack-manifest.json"
      - "scripts/**"
      - "installer/**"`r`n      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build EXE installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null

          Copy-Item "installer\Install-MajorKeyPack.ps1" "build\Install-MajorKeyPack.ps1"
          Copy-Item "scripts\Install-MajorKeyPack.ps1" "build\Install-MajorKeyPack-Core.ps1"
          Copy-Item "modpack-manifest.json" "build\modpack-manifest.json"

          New-Item -ItemType Directory -Force "launcher-build" | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <AssemblyName>MajorKeyPack-Installer</AssemblyName>
              <RootNamespace>MajorKeyPackInstaller</RootNamespace>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>false</SelfContained>
            </PropertyGroup>
          </Project>
          '@ | Set-Content "launcher-build\MajorKeyPack-Installer.csproj" -Encoding UTF8

          @'
          using System.Diagnostics;

          string script = Path.Combine(AppContext.BaseDirectory, "Install-MajorKeyPack.ps1");

          if (!File.Exists(script))
          {
              System.Windows.Forms.MessageBox.Show(
                  "Install-MajorKeyPack.ps1 was not found.",
                  "Major Key Pack",
                  System.Windows.Forms.MessageBoxButtons.OK,
                  System.Windows.Forms.MessageBoxIcon.Error);
              return;
          }

          var psi = new ProcessStartInfo
          {
              FileName = "powershell.exe",
              Arguments = "-NoProfile -ExecutionPolicy Bypass -File \"" + script + "\"",
              UseShellExecute = true,
              WorkingDirectory = AppContext.BaseDirectory
          };

          using var process = Process.Start(psi);
          process?.WaitForExit();
          '@ | Set-Content "launcher-build\Program.cs" -Encoding UTF8

          dotnet publish "launcher-build\MajorKeyPack-Installer.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o "build\launcher"

          Copy-Item "build\launcher\MajorKeyPack-Installer.exe" "build\MajorKeyPack-Installer.exe"

          Compress-Archive `
            -Path "build\*" `
            -DestinationPath "MajorKeyPack-Installer.zip" `
            -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Major Key Pack v${{ github.run_number }}"
          generate_release_notes: true
          files: |
            MajorKeyPack-Installer.zip
            build/MajorKeyPack-Installer.exe
            modpack-manifest.json

