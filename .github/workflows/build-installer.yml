name: Build Major Key Pack NeoForge Installer

on:
push:
branches:
- main
paths:
- "installer/**"
- "modpack-manifest.json"
- ".github/workflows/build-installer.yml"

workflow_dispatch:

permissions:
contents: write

jobs:
build-installer:
runs-on: windows-latest

steps:

  # ------------------------------------------------------
  # Checkout
  # ------------------------------------------------------

  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0
      fetch-tags: true

  # ------------------------------------------------------
  # Determine release version
  # ------------------------------------------------------

  - name: Determine release version
    shell: pwsh
    run: |
      $tags = git tag --list "v*" |
        Where-Object {
          $_ -match '^v\d+$'
        } |
        ForEach-Object {
          [int]($_.Substring(1))
        }

      if ($tags.Count -eq 0) {
        $nextVersion = 1
      }
      else {
        $nextVersion = ($tags | Measure-Object -Maximum).Maximum + 1
      }

      $version = "v$nextVersion"

      Write-Host "Release version: $version"

      "RELEASE_VERSION=$version" |
        Out-File `
          -FilePath $env:GITHUB_ENV `
          -Encoding utf8 `
          -Append

  # ------------------------------------------------------
  # Setup .NET
  # ------------------------------------------------------

  - name: Setup .NET 8
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: "8.0.x"

  # ------------------------------------------------------
  # Prepare build directory
  # ------------------------------------------------------

  - name: Prepare build directory
    shell: pwsh
    run: |
      if (Test-Path "build") {
        Remove-Item "build" -Recurse -Force
      }

      New-Item `
        -ItemType Directory `
        -Path "build" `
        -Force |
        Out-Null

      Copy-Item `
        "installer\Install-MajorKeyPack.ps1" `
        "build\Install-MajorKeyPack.ps1" `
        -Force

      Copy-Item `
        "modpack-manifest.json" `
        "build\modpack-manifest.json" `
        -Force

  # ------------------------------------------------------
  # Validate manifest
  # ------------------------------------------------------

  - name: Validate modpack manifest
    shell: pwsh
    run: |
      $manifest = Get-Content `
        "modpack-manifest.json" `
        -Raw |
        ConvertFrom-Json

      if ($manifest.minecraft -ne "1.21.1") {
        throw "Expected Minecraft 1.21.1."
      }

      if ($manifest.loader -ne "NeoForge") {
        throw "Expected NeoForge loader."
      }

      if ($null -eq $manifest.mods) {
        throw "Manifest is missing the mods array."
      }

      $mods = @($manifest.mods)

      if ($mods.Count -eq 0) {
        throw "Manifest contains no mods."
      }

      Write-Host "Minecraft: $($manifest.minecraft)"
      Write-Host "Loader:    $($manifest.loader)"
      Write-Host "Mods:      $($mods.Count)"

      foreach ($mod in $mods) {

        if ([string]::IsNullOrWhiteSpace($mod.filename)) {
          throw "A mod is missing filename."
        }

        if ([string]::IsNullOrWhiteSpace($mod.url)) {
          throw "Mod '$($mod.filename)' is missing URL."
        }

        if ([string]::IsNullOrWhiteSpace($mod.sha256)) {
          throw "Mod '$($mod.filename)' is missing SHA256."
        }

        if ($null -eq $mod.size) {
          throw "Mod '$($mod.filename)' is missing size."
        }
      }

      Write-Host "Manifest validation passed."

  # ------------------------------------------------------
  # Create temporary .NET project
  # ------------------------------------------------------

  - name: Create launcher project
    shell: pwsh
    run: |
      $project = @'
      <Project Sdk="Microsoft.NET.Sdk">

        <PropertyGroup>
          <OutputType>WinExe</OutputType>
          <TargetFramework>net8.0-windows</TargetFramework>
          <UseWindowsForms>true</UseWindowsForms>
          <ImplicitUsings>enable</ImplicitUsings>
          <Nullable>enable</Nullable>

          <AssemblyName>MajorKeyPack-Installer</AssemblyName>
          <RootNamespace>MajorKeyPackInstaller</RootNamespace>

          <PublishSingleFile>true</PublishSingleFile>
          <SelfContained>true</SelfContained>
          <RuntimeIdentifier>win-x64</RuntimeIdentifier>
          <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>

          <EnableCompressionInSingleFile>true</EnableCompressionInSingleFile>
          <DebugType>none</DebugType>
          <DebugSymbols>false</DebugSymbols>
        </PropertyGroup>

        <ItemGroup>
          <EmbeddedResource Include="Install-MajorKeyPack.ps1">
            <LogicalName>Install-MajorKeyPack.ps1</LogicalName>
          </EmbeddedResource>

          <EmbeddedResource Include="modpack-manifest.json">
            <LogicalName>modpack-manifest.json</LogicalName>
          </EmbeddedResource>
        </ItemGroup>

      </Project>
      '@

      Set-Content `
        -Path "build\MajorKeyPack-Installer.csproj" `
        -Value $project `
        -Encoding UTF8

      Copy-Item `
        "installer\MajorKeyPackLauncher.cs" `
        "build\Program.cs" `
        -Force

  # ------------------------------------------------------
  # Inject current version into launcher
  # ------------------------------------------------------

  - name: Set launcher version
    shell: pwsh
    run: |
      $path = "build\Program.cs"

      $content = Get-Content `
        $path `
        -Raw

      $content = $content.Replace(
        '__CURRENT_VERSION__',
        '${{ env.RELEASE_VERSION }}'
      )

      Set-Content `
        -Path $path `
        -Value $content `
        -Encoding UTF8

  # ------------------------------------------------------
  # Build installer
  # ------------------------------------------------------

  - name: Build installer
    shell: pwsh
    run: |
      dotnet publish `
        "build\MajorKeyPack-Installer.csproj" `
        --configuration Release `
        --runtime win-x64 `
        --self-contained true `
        --output "build\publish"

      $exe = "build\publish\MajorKeyPack-Installer.exe"

      if (!(Test-Path $exe)) {
        throw "Installer EXE was not created."
      }

      Copy-Item `
        $exe `
        "build\MajorKeyPack-Installer.exe" `
        -Force

      Write-Host "Installer built successfully."

  # ------------------------------------------------------
  # Verify installer
  # ------------------------------------------------------

  - name: Verify installer
    shell: pwsh
    run: |
      $exe = Get-Item "build\MajorKeyPack-Installer.exe"

      if ($exe.Length -lt 1000000) {
        throw "Installer appears unexpectedly small: $($exe.Length) bytes."
      }

      Write-Host "Installer size: $($exe.Length) bytes"

  # ------------------------------------------------------
  # Create ZIP
  # ------------------------------------------------------

  - name: Create installer ZIP
    shell: pwsh
    run: |
      $zip = "build\MajorKeyPack-Installer.zip"

      if (Test-Path $zip) {
        Remove-Item $zip -Force
      }

      Compress-Archive `
        -Path "build\MajorKeyPack-Installer.exe" `
        -DestinationPath $zip `
        -CompressionLevel Optimal

      Write-Host "ZIP created."

  # ------------------------------------------------------
  # Create GitHub release
  # ------------------------------------------------------

  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: ${{ env.RELEASE_VERSION }}
      name: Major Key Pack NeoForge ${{ env.RELEASE_VERSION }}
      generate_release_notes: true
      make_latest: true
      files: |
        build/MajorKeyPack-Installer.exe
        build/MajorKeyPack-Installer.zip
        modpack-manifest.json
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
