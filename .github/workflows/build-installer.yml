name: Build Major Key Pack Installer

on:
  workflow_dispatch:

  push:
    paths:
      - "modpack-manifest.json"
      - "scripts/**"
      - "installer/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build standalone EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          New-Item -ItemType Directory -Force launcher-build | Out-Null

          Copy-Item `
            "installer\Install-MajorKeyPack.ps1" `
            "launcher-build\Install-MajorKeyPack.ps1"

          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <AssemblyName>MajorKeyPack-Installer</AssemblyName>
              <RootNamespace>MajorKeyPackInstaller</RootNamespace>
              <PublishSingleFile>true</PublishSingleFile>
              <SelfContained>true</SelfContained>
              <IncludeNativeLibrariesForSelfExtract>true</IncludeNativeLibrariesForSelfExtract>
            </PropertyGroup>

            <ItemGroup>
              <EmbeddedResource Include="Install-MajorKeyPack.ps1" />
            </ItemGroup>
          </Project>
          "@ | Set-Content `
            "launcher-build\MajorKeyPack-Installer.csproj" `
            -Encoding UTF8

          @'
          using System.Diagnostics;
          using System.Reflection;
          using System.Windows.Forms;

          string minecraftDirectory = Path.Combine(
              Environment.GetFolderPath(Environment.SpecialFolder.ApplicationData),
              ".minecraft");

          string installDirectory = Path.Combine(
              Environment.GetFolderPath(Environment.SpecialFolder.ApplicationData),
              "MajorKeyPack");

          if (!Directory.Exists(minecraftDirectory))
          {
              MessageBox.Show(
                  "Minecraft Java Edition was not found.`n`nPlease install Minecraft Java Edition first.",
                  "Major Key Pack",
                  MessageBoxButtons.OK,
                  MessageBoxIcon.Error);

              Environment.Exit(1);
          }

          string versionsDirectory =
              Path.Combine(minecraftDirectory, "versions");

          bool forgeFound =
              Directory.Exists(versionsDirectory) &&
              Directory.GetDirectories(versionsDirectory)
                  .Any(x =>
                      Path.GetFileName(x)
                          .StartsWith(
                              "1.20.1-forge-",
                              StringComparison.OrdinalIgnoreCase));

          if (!forgeFound)
          {
              const string forgeUrl =
                  "https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html";

              var result = MessageBox.Show(
                  "Forge 1.20.1 was not found.`n`n" +
                  "Please install Forge 1.20.1 before installing Major Key Pack.`n`n" +
                  "Click Yes to open the official Forge download page.`n" +
                  "Click No to exit.",
                  "Major Key Pack - Forge Required",
                  MessageBoxButtons.YesNo,
                  MessageBoxIcon.Warning);

              if (result == DialogResult.Yes)
              {
                  Process.Start(new ProcessStartInfo
                  {
                      FileName = forgeUrl,
                      UseShellExecute = true
                  });

                  MessageBox.Show(
                      "Install Forge 1.20.1, then run the Major Key Pack installer again.",
                      "Major Key Pack",
                      MessageBoxButtons.OK,
                      MessageBoxIcon.Information);
              }

              Environment.Exit(1);
          }

          const string resourceName =
              "MajorKeyPackInstaller.Install-MajorKeyPack.ps1";

          string tempDirectory = Path.Combine(
              Path.GetTempPath(),
              "MajorKeyPack-" +
              Guid.NewGuid().ToString("N"));

          Directory.CreateDirectory(tempDirectory);

          string scriptPath =
              Path.Combine(
                  tempDirectory,
                  "Install-MajorKeyPack.ps1");

          using Stream? resource =
              Assembly.GetExecutingAssembly()
                  .GetManifestResourceStream(resourceName);

          if (resource == null)
          {
              MessageBox.Show(
                  "The installer script could not be found inside the EXE.",
                  "Major Key Pack",
                  MessageBoxButtons.OK,
                  MessageBoxIcon.Error);

              Environment.Exit(1);
          }

          using (FileStream output = File.Create(scriptPath))
          {
              resource.CopyTo(output);
          }

          var psi = new ProcessStartInfo
          {
              FileName = "powershell.exe",
              UseShellExecute = true,
              WorkingDirectory = tempDirectory
          };

          psi.ArgumentList.Add("-NoProfile");
          psi.ArgumentList.Add("-ExecutionPolicy");
          psi.ArgumentList.Add("Bypass");
          psi.ArgumentList.Add("-File");
          psi.ArgumentList.Add(scriptPath);
          psi.ArgumentList.Add("-InstallDirectory");
          psi.ArgumentList.Add(installDirectory);

          using Process? process = Process.Start(psi);

          if (process == null)
          {
              MessageBox.Show(
                  "Failed to start the installer.",
                  "Major Key Pack",
                  MessageBoxButtons.OK,
                  MessageBoxIcon.Error);

              Environment.Exit(1);
          }

          process.WaitForExit();

          try
          {
              Directory.Delete(tempDirectory, true);
          }
          catch
          {
          }

          Environment.Exit(process.ExitCode);
          '@ | Set-Content `
            "launcher-build\Program.cs" `
            -Encoding UTF8

          dotnet publish `
            "launcher-build\MajorKeyPack-Installer.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o "build\launcher"

          if (!(Test-Path "build\launcher\MajorKeyPack-Installer.exe")) {
              throw "EXE build failed."
          }

          Copy-Item `
            "build\launcher\MajorKeyPack-Installer.exe" `
            "build\MajorKeyPack-Installer.exe"

          Compress-Archive `
            -Path "build\*" `
            -DestinationPath "MajorKeyPack-Installer.zip" `
            -Force

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force

          $tags = @(
            git tag --list "v*" |
              Where-Object { $_ -match "^v\d+$" } |
              ForEach-Object {
                [int]$_.Substring(1)
              }
          )

          if ($tags.Count -eq 0) {
            $next = 1
          }
          else {
            $next =
              ($tags | Measure-Object -Maximum).Maximum + 1
          }

          $version = "v$next"

          Write-Host "Existing numeric tags:"
          $tags |
            Sort-Object |
            ForEach-Object {
              Write-Host "  v$_"
            }

          Write-Host ""
          Write-Host "Next release: $version"

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.version }}"
          name: "Major Key Pack ${{ steps.version.outputs.version }}"`r`n          make_latest: true
          generate_release_notes: true
          files: |
            MajorKeyPack-Installer.zip
            build/MajorKeyPack-Installer.exe
            modpack-manifest.json

