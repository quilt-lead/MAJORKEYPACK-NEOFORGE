name: Build Major Key Pack

on:
  workflow_dispatch:
  push:
    paths:
      - "modpack-manifest.json"
      - "scripts/**"
      - "installer/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create mods archive
        shell: pwsh
        run: |
          if (!(Test-Path "mods")) {
            throw "mods folder is missing from the repository."
          }

          Compress-Archive `
            -Path "mods\*.jar" `
            -DestinationPath "mods.zip" `
            -Force

      - name: Build installer package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null

          Copy-Item `
            "installer\Install-MajorKeyPack.ps1" `
            "build\Install-MajorKeyPack.ps1"

          Copy-Item `
            "scripts\Install-MajorKeyPack.ps1" `
            "build\Install-MajorKeyPack.ps1"

          Copy-Item `
            "modpack-manifest.json" `
            "build\modpack-manifest.json"

          Copy-Item `
            "mods.zip" `
            "build\mods.zip"

          Compress-Archive `
            -Path "build\*" `
            -DestinationPath "MajorKeyPack-Installer.zip" `
            -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Major Key Pack v${{ github.run_number }}"
          generate_release_notes: true
          files: |
            MajorKeyPack-Installer.zip
            mods.zip
            modpack-manifest.json
